<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    .taiji {
      transform-origin: 50px 50px;
      animation: spin 5s linear infinite;
    }
  </style>
  
  <g class="taiji">
    <!-- Metade Cinza-Terra (Yin) -->
    <path d="M 50 2 A 48 48 0 0 0 50 98 A 24 24 0 0 0 50 50 A 24 24 0 0 1 50 2" fill="#2C2825" />
    
    <!-- Metade Vermelho-Sangue (Yang) -->
    <path d="M 50 2 A 48 48 0 0 1 50 98 A 24 24 0 0 1 50 50 A 24 24 0 0 0 50 2" fill="#8B0000" />
    
    <!-- Ponto Superior -->
    <circle cx="50" cy="26" r="8" fill="#2C2825" />
    
    <!-- Ponto Inferior -->
    <circle cx="50" cy="74" r="8" fill="#8B0000" />
    
    <!-- Borda Dourada -->
    <circle cx="50" cy="50" r="48" fill="none" stroke="#F5C77E" stroke-width="3" />
  </g>
</svg>
